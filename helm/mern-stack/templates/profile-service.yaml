apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-profile
  labels:
    {{- include "mern-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: profile
spec:
  replicas: {{ .Values.profileService.replicas }}
  selector:
    matchLabels:
      {{- include "mern-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: profile
  template:
    metadata:
      labels:
        {{- include "mern-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: profile
    spec:
      containers:
        - name: profile
          image: "{{ .Values.profileService.image.repository }}:{{ .Values.profileService.image.tag }}"
          imagePullPolicy: {{ .Values.profileService.image.pullPolicy }}
          env:
            - name: PORT
              value: "3002"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.rootPasswordKey }}
            - name: MONGO_URL
              value: "mongodb://root:$(MONGODB_PASSWORD)@mongodb:27017/profiles?authSource=admin"
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.profileService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  labels:
    {{- include "mern-stack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mern-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: profile
  ports:
    - name: http
      port: 3002
      targetPort: http
