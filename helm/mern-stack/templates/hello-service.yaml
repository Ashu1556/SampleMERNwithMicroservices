apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hello
  labels:
    {{- include "mern-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hello
spec:
  replicas: {{ .Values.helloService.replicas }}
  selector:
    matchLabels:
      {{- include "mern-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hello
  template:
    metadata:
      labels:
        {{- include "mern-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hello
    spec:
      containers:
        - name: hello
          image: "{{ .Values.helloService.image.repository }}:{{ .Values.helloService.image.tag }}"
          imagePullPolicy: {{ .Values.helloService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.helloService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  labels:
    {{- include "mern-stack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mern-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hello
  ports:
    - name: http
      port: 3001
      targetPort: http
